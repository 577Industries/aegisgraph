name: tier3-research-invariants-ground-truth

# Ground-truth pass for InvariantCheck library v3 (M7-GT-v3, Wave 8A).
#
# Runs tests/invariants/test_ground_truth_pass.py against the synthetic
# tests/fixtures/demo-vulnerable-app/ fixture under real CodeQL CLI +
# Semgrep binaries. The unit-test suite in `make test` uses the same
# harness but skips the binary-gated assertions when the toolchains are
# absent; this workflow exists to exercise the binary-present path.
#
# Triggers:
#   * Changes to the InvariantCheck library directory.
#   * Changes to the demo-vulnerable-app fixture.
#   * Manual workflow_dispatch.
#   * Weekly cron so regressions in upstream CodeQL / Semgrep
#     toolchains are caught.
#
# Toolchain pins (per devcontainer/Dockerfile + Phase II plan T-M4.1):
#   CodeQL CLI 2.26.4
#   Semgrep   1.86
#
# Security posture: this workflow consumes only repo-controlled inputs
# (paths-filtered push/PR triggers, workflow_dispatch, cron). No
# github.event.* user-controlled fields are interpolated into run:
# blocks. All `run:` commands operate on repo-tracked files only.

on:
  push:
    branches:
      - main
      - "stream/**"
    paths:
      - "aegisgraph/invariants/library/**"
      - "tests/fixtures/demo-vulnerable-app/**"
      - "tests/invariants/test_ground_truth_pass.py"
      - ".github/workflows/invariants-ground-truth.yml"
  pull_request:
    paths:
      - "aegisgraph/invariants/library/**"
      - "tests/fixtures/demo-vulnerable-app/**"
      - "tests/invariants/test_ground_truth_pass.py"
      - ".github/workflows/invariants-ground-truth.yml"
  workflow_dispatch:
  schedule:
    # Weekly: Monday 07:00 UTC.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  ground-truth-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Setup CodeQL CLI 2.26.4
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.26.4/codeql-bundle-linux64.tar.gz

      # codeql-action/init stages a scanning environment (CODEQL_DIST etc.)
      # but does NOT put the CLI on PATH — the first real run of this
      # workflow died on `codeql: command not found` (run 33403159264).
      - name: Add CodeQL CLI to PATH
        run: |
          test -n "$CODEQL_DIST" || { echo "CODEQL_DIST not exported by init"; exit 1; }
          test -x "$CODEQL_DIST/codeql" || { echo "no codeql binary under $CODEQL_DIST"; exit 1; }
          echo "$CODEQL_DIST" >> "$GITHUB_PATH"

      - name: Verify CodeQL CLI on PATH
        run: |
          codeql --version
          codeql resolve qlpacks | head -20

      - name: Install Semgrep 1.86
        run: |
          pip install "semgrep==1.86.0"
          semgrep --version

      # TEMPORARY (debug, remove once green): one direct buildless create,
      # bypassing pytest, plus the database's own extractor logs — the
      # zero-files exit 32 reproduces on CI only and its cause never
      # reaches stdout/stderr.
      - name: Debug direct buildless create
        run: |
          env | sort | grep -E '^(JAVA|CODEQL|SEMMLE|LD_)' || echo "(no JAVA*/CODEQL*/SEMMLE*/LD_* vars)"
          codeql database create /tmp/dbg-db --language=java \
            --source-root tests/fixtures/demo-vulnerable-app \
            --overwrite --build-mode=none || echo "DIRECT CREATE FAILED ($?)"
          echo "=== source root after create ==="
          ls -la tests/fixtures/demo-vulnerable-app
          git status --porcelain tests/fixtures/demo-vulnerable-app || true
          echo "=== db log files ==="
          ls -la /tmp/dbg-db/log 2>/dev/null || true
          for f in /tmp/dbg-db/log/*; do echo "--- $f (tail)"; tail -60 "$f"; done 2>/dev/null || true

      - name: Run ground-truth pass
        run: |
          python3 -m pytest tests/invariants/test_ground_truth_pass.py -v --tb=short

      - name: Run full invariants test suite
        run: |
          python3 -m pytest tests/invariants/ -v --tb=short

      - name: Upload SARIF artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ground-truth-sarif
          path: |
            /tmp/codeql-*.sarif
            /tmp/semgrep-*.json
          if-no-files-found: ignore
