name: tier3-research-invariants-ground-truth

# Ground-truth pass for InvariantCheck library v3 (M7-GT-v3, Wave 8A).
#
# Runs tests/invariants/test_ground_truth_pass.py against the synthetic
# tests/fixtures/demo-vulnerable-app/ fixture under real CodeQL CLI +
# Semgrep binaries. The unit-test suite in `make test` uses the same
# harness but skips the binary-gated assertions when the toolchains are
# absent; this workflow exists to exercise the binary-present path.
#
# Triggers:
#   * Changes to the InvariantCheck library directory.
#   * Changes to the demo-vulnerable-app fixture.
#   * Manual workflow_dispatch.
#   * Weekly cron so regressions in upstream CodeQL / Semgrep
#     toolchains are caught.
#
# Toolchain pins (per devcontainer/Dockerfile + Phase II plan T-M4.1):
#   CodeQL CLI 2.26.4
#   Semgrep   1.86
#
# Security posture: this workflow consumes only repo-controlled inputs
# (paths-filtered push/PR triggers, workflow_dispatch, cron). No
# github.event.* user-controlled fields are interpolated into run:
# blocks. All `run:` commands operate on repo-tracked files only.

on:
  push:
    branches:
      - main
      - "stream/**"
    paths:
      - "aegisgraph/invariants/library/**"
      - "tests/fixtures/demo-vulnerable-app/**"
      - "tests/fixtures/demo-vulnerable-app-traced/**"
      - "tests/invariants/test_ground_truth_pass.py"
      - ".github/workflows/invariants-ground-truth.yml"
  pull_request:
    paths:
      - "aegisgraph/invariants/library/**"
      - "tests/fixtures/demo-vulnerable-app/**"
      - "tests/fixtures/demo-vulnerable-app-traced/**"
      - "tests/invariants/test_ground_truth_pass.py"
      - ".github/workflows/invariants-ground-truth.yml"
  workflow_dispatch:
  schedule:
    # Weekly: Monday 07:00 UTC.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  ground-truth-pass:
    # Pinned image, not -latest: the JDK / Kotlin / Gradle the image ships are
    # part of this job's reproducibility claim once the traced job lands.
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      # Direct pinned-bundle install — deliberately NOT codeql-action/init.
      # init is a code-scanning workflow primitive: it stages an in-progress
      # scan session on the machine (a database cluster under $RUNNER_TEMP
      # plus tracer env), and `codeql database create` detects that session
      # and joins it — every manual create then finalizes EMPTY (exit 32,
      # "could not process any of it"), even under a fully scrubbed env -i
      # (bisected on run 33547-era attempts). This harness drives the raw
      # CLI itself, so it needs a bare toolchain, not a scan session.
      - name: Install CodeQL CLI 2.26.4 (pinned bundle)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/codeql-bundle.tar.gz" \
            "https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.26.4/codeql-bundle-linux64.tar.gz"
          echo "48e1ab8b874d57bd6fd7c90fefee75addc5a45e9bd063982df9beb45a62dd5d3  $RUNNER_TEMP/codeql-bundle.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/codeql-bundle.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/codeql" >> "$GITHUB_PATH"

      - name: Verify CodeQL CLI on PATH
        run: |
          codeql --version
          codeql resolve qlpacks | head -20

      - name: Install Semgrep 1.86
        run: |
          pip install "semgrep==1.86.0"
          semgrep --version

      # -rxX: pyproject sets addopts = "-q", so without it the ten recorded
      # xfail reasons — the actual product of this job — never reach the log.
      # The CodeQL database is built once per session (see the codeql_db
      # fixture); twelve identical creates used to cost ~17 of the job's
      # 27 minutes.
      - name: Run ground-truth pass
        run: |
          python3 -m pytest tests/invariants/test_ground_truth_pass.py -v -rxX --tb=short

      - name: Run the rest of the invariants suite
        run: |
          python3 -m pytest tests/invariants/ -v -rxX --tb=short \
            --ignore=tests/invariants/test_ground_truth_pass.py

      # The buildless probe writes Gradle wrapper litter (gradlew, gradle/,
      # .gradle/) into the fixture; it is gitignored, so a clean porcelain
      # here means no TRACKED fixture file was touched by the run.
      - name: Assert the fixture tree is unchanged
        run: |
          git status --porcelain --ignored=matching tests/fixtures/demo-vulnerable-app || true
          test -z "$(git status --porcelain tests/fixtures/demo-vulnerable-app)"

      - name: Upload SARIF artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ground-truth-sarif
          path: |
            /tmp/pytest-of-*/pytest-*/**/*.sarif
            /tmp/semgrep-*.json
          if-no-files-found: ignore

  # Traced compile of the same fixture through tests/fixtures/demo-vulnerable-app-traced/
  # (Gradle + Kotlin plugin 2.4.0 + android.jar). --build-mode=none never extracts
  # Kotlin, so INV-03/06/11/13/15 can only be measured here. Hosted ubuntu-24.04
  # ships Gradle, Temurin 17 (JAVA_HOME) and the android-34 platform, so no
  # self-hosted runner is involved. Independent of the buildless job above; its
  # xfail table is the "traced" entry in GROUND_TRUTH_XFAIL_BY_MODE.
  ground-truth-traced:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AEGISGRAPH_GT_MODE: traced

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Install CodeQL CLI 2.26.4 (pinned bundle)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/codeql-bundle.tar.gz" \
            "https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.26.4/codeql-bundle-linux64.tar.gz"
          echo "48e1ab8b874d57bd6fd7c90fefee75addc5a45e9bd063982df9beb45a62dd5d3  $RUNNER_TEMP/codeql-bundle.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/codeql-bundle.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/codeql" >> "$GITHUB_PATH"

      # The traced build needs the runner's own JDK, Gradle and Android SDK —
      # record exactly which versions produced this run's counts.
      - name: Record the traced toolchain
        run: |
          codeql --version | head -1
          java -version 2>&1 | head -1
          gradle --version | grep -E 'Gradle|Kotlin|JVM'
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms/android-34/android.jar"

      - name: Run ground-truth pass (traced)
        run: |
          python3 -m pytest tests/invariants/test_ground_truth_pass.py -v -rxX --tb=short -k "codeql or fixture"

      - name: Assert the fixture tree is unchanged
        run: |
          git status --porcelain --ignored=matching tests/fixtures/demo-vulnerable-app tests/fixtures/demo-vulnerable-app-traced || true
          test -z "$(git status --porcelain tests/fixtures/demo-vulnerable-app tests/fixtures/demo-vulnerable-app-traced)"

      - name: Upload SARIF artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ground-truth-traced-sarif
          path: |
            /tmp/pytest-of-*/pytest-*/**/*.sarif
          if-no-files-found: ignore
