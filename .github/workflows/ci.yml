name: tier3-research-ci

# Runs the safe-validation gate on every PR + every push to main and
# stream branches. The strict tooling gate is conditionally enforced:
# if a self-hosted runner with the pinned toolchain is available it runs
# in --strict mode, otherwise it runs in non-strict diagnostic mode and
# the workflow logs the gap. See docs/operating-procedures.md section 7.
#
# Security note: this workflow only consumes repo-controlled inputs (no
# issue titles, PR descriptions, comment bodies). All ${{ }} expansions
# are static or repo-config values; nothing user-supplied is fed to a
# `run:` block.

on:
  pull_request:
  push:
    branches:
      - main
      - "stream/**"
      - "team/**"

# Cancel superseded pull-request runs only; push runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  safe-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" || python -m pip install -e .
          python -m pip install pytest jsonschema lxml pyyaml httpx whatwg-url
      - name: Run pytest
        run: make test
      - name: Validate evidence contract and safety gates
        run: make validate
      # Tooling-strict on the public ubuntu-latest runner is best-effort:
      # CodeQL CLI / Clang 18 / Android NDK r26d are not on the default
      # runner. We invoke `make tooling` (non-strict) so the
      # tooling-versions.json artifact still captures the gap; strict
      # enforcement happens on the self-hosted runner via reproduce.yml.
      - name: Probe tooling (non-strict diagnostic)
        run: make tooling || true

  # tooling-strict-self-hosted is wired to a self-hosted runner ONLY when
  # one is available with the pinned devcontainer image. Stays disabled
  # by default so first-time forks do not see "queued forever" jobs.
  tooling-strict-self-hosted:
    runs-on: self-hosted
    if: ${{ false }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Strict tooling gate
        run: make tooling-strict
