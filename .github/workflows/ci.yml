name: tier3-research-ci

on:
  pull_request:
  push:
    branches:
      - main
      - "team/**"

jobs:
  safe-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e . pytest jsonschema
      - name: Run non-exploit-adjacent tests first
        run: make test
      - name: Validate evidence contract and safety gates
        run: make validate
