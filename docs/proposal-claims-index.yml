# proposal-claims-index.yml
#
# Owned schema: integration stream. Populated content: validator-export stream.
#
# Each entry pairs a claim_id (a stable cross-reference token used in
# evidence_refs[*].claim_id and in the traceability matrix) with the
# source location in the proposal and the owning section.
#
# Schema (additive-only; new fields nullable):
#
#   - claim_id:         string, format ^AG-CLAIM-[A-Z0-9-]+$
#                       stable identifier; once published, never renamed
#   - source_location:  string, doc-relative path + section anchor
#                       e.g. "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#technical-volume-section-3.2"
#   - claim_text:       string, verbatim quote from the proposal (keep
#                       under 500 chars; longer claims are summarized
#                       and the full text linked via source_location)
#   - owner_section:    string, one of:
#                         technical_volume | management_plan | sbir_application
#                       | dsip_response | proposal_appendix
#   - spec_section:     optional string. Section anchor in
#                       /SPEC.md the claim is grounded in (Tier-3
#                       research spec). One of "1" / "2.1" / "4.7" / etc.
#   - dsip_requirement: optional string. requirement_id from
#                       docs/dsip-requirements.yml the claim addresses.
#   - evidence_record:  optional string, the AG-EV-* record id that
#                       currently substantiates this claim (null until a
#                       record exists)
#   - evidence_artifacts: optional list of repo-relative paths the
#                         claim depends on (used by the traceability
#                         matrix to verify on-disk presence).
#   - status:           enum: drafted | substantiated | retired
#                         drafted     - claim is in the proposal but no
#                                       evidence record yet (or the
#                                       record's pipeline hasn't merged)
#                         substantiated - evidence_record is set and
#                                         passing validation
#                         retired     - claim was removed from the
#                                       proposal
#
# Population rules (applied for v0.3 master proposal):
#
#   - Every "novel contribution" sub-bullet in §4.4 gets a claim_id.
#   - Every metric in §9.x gate tables gets a claim_id (these are the
#     auditable success criteria).
#   - Every Phase II deliverable in §9.x gets a claim_id (these are the
#     contractual artifacts; DSIP requirements lift right into them).
#   - Compliance gates in §15 get a claim_id but are owned by the
#     proposal-package agent, not validator-export. We mark them
#     status: drafted with no evidence_record (humans complete those).
#   - Workstream artifacts (ReproChain harness, PolyDiff regression set,
#     SMABench rings) get claim_ids tied to the corresponding evidence
#     pipeline. status=drafted until the engineering streams merge.

claims:
  # ----- §4.4 What is novel about AegisGraph (4 contributions) -----
  - claim_id: AG-CLAIM-NOVEL-REPROCHAIN-PRE-DISCLOSURE
    source_location: "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#4.4-what-is-novel-about-aegisgraph"
    claim_text: >-
      ReproChain — reachability-prioritized assessment with pre-disclosure simulation.
      AegisGraph constructs a reachability graph from external attacker inputs through
      parsers and decoders to sensitive boundaries, weights it with a transparent
      10-dimension score vector, and demonstrates against CVE-2023-4863 (libwebp
      BuildHuffmanTable heap overflow) that the methodology surfaces relevant
      attack-surface evidence ahead of public disclosure.
    owner_section: technical_volume
    spec_section: "4"
    evidence_record: AG-EV-REPROCHAIN-SIGNAL-ANDROID-MAP-001
    evidence_artifacts:
      - reprochain/evidence/build_manifest.json
      - reprochain/evidence/run_status.json
      - reprochain/evidence/mapping.json
    status: drafted

  - claim_id: AG-CLAIM-NOVEL-POLYDIFF-FACT-VECTOR
    source_location: "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#4.4-what-is-novel-about-aegisgraph"
    claim_text: >-
      PolyDiff — differential-parser methodology with normalized fact vectors and
      rediscovery anchor. The novelty is (a) the fact-vector schema that normalizes
      parse-tree disagreements across 7+ parser implementations into comparable feature
      vectors, (b) the security-relevance classifier that distinguishes spec-permitted
      variation from security-relevant disagreement, and (c) the rediscovery anchor —
      without seeding, the regression set rediscovers ≥3 known historical URL-parser
      bugs, providing reviewers a direct measurement of methodology effectiveness.
    owner_section: technical_volume
    spec_section: "5"
    evidence_record: AG-EV-POLYDIFF-REG-001
    evidence_artifacts:
      - polydiff/regression/report.json
      - polydiff/evidence/regression.evidence.json
      - schema/fact-vector.schema.json
    status: drafted

  - claim_id: AG-CLAIM-NOVEL-CLAIM-STATE-GOVERNANCE
    source_location: "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#4.4-what-is-novel-about-aegisgraph"
    claim_text: >-
      Claim-state governance with score-vector calibration. The lifecycle (observed →
      anchored → scored → validation-tasked → reviewed → accepted/limited/retired)
      prevents static observations from being promoted to vulnerability claims, and
      pairs with a transparent score-vector model that supports synthetic-mitigation
      deltas. The Tier-3 spec demonstrates this through a deliberate-corruption test
      in the validator: introducing a forbidden-pattern violation, target-source
      redistribution marker, or score-vector key mismatch is caught and rejected.
    owner_section: technical_volume
    spec_section: "8"
    evidence_record: null
    evidence_artifacts:
      - schema/evidence.schema.json
      - aegisgraph/safety.py
      - aegisgraph/score.py
      - validator/sanitize_check.py
    status: drafted

  - claim_id: AG-CLAIM-NOVEL-SMABENCH-THREE-RING
    source_location: "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#4.4-what-is-novel-about-aegisgraph"
    claim_text: >-
      Reproducible benchmark surface (SMABench three-ring structure). Ring 1 fixtures
      are reproducible from sealed inputs; Ring 2 evidence rebuilds from pinned commits;
      Ring 3 is gated by written authorization. SMABench is a benchmark surface other
      proposers and academics can use to compare assessment systems without needing
      access to live targets.
    owner_section: technical_volume
    spec_section: "7"
    evidence_record: null
    evidence_artifacts:
      - smabench/results/latest/results.json
    status: drafted

