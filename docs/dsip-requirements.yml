      - "Risks / mitigations"
      - "Schedule"
      - "Dependencies"
      - "Metrics"
    requirement_id: DSIP-DELIVERABLE-KICKOFF
  - deliverable_id: M4-Q1
    due_quarter: "Month 4"
    contents:
      - "v0.3 evidence package + checksums"
      - "Schema specification"
      - "External validation packet draft"
    requirement_id: DSIP-DELIVERABLE-Q1
  - deliverable_id: M7-Q2
    due_quarter: "Month 7"
    contents:
      - "Quantitative interim briefing"
      - "Ring 1 harness report"
      - "Graph-path precision report"
    requirement_id: DSIP-DELIVERABLE-Q2
  - deliverable_id: M10-Q3
    due_quarter: "Month 10"
    contents:
