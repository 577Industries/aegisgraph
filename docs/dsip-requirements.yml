    category: deliverable
    response_location: "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#9.6-months-15-24-option"
    status: drafted

  # ----- Submission artifacts (compliance gates) -----
  - requirement_id: DSIP-SUB-ART-SAM-GOV
    source_anchor: "HR0011SB20254-12 Section II — Eligibility / DSIP Vol 1"
    requirement_text: >-
      Active SAM.gov registration with UEI, CAGE, and current representations.
    category: submission_artifact
    response_location: "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#15-compliance-and-submission-gates"
    status: drafted

  - requirement_id: DSIP-SUB-ART-VOL5-CERTS
    source_anchor: "HR0011SB20254-12 DSIP Vol 5 — Certifications"
    requirement_text: >-
      Volume 5 DSIP certifications complete (SBA SBC representation, fraud,
      lobbying, etc.).
    category: submission_artifact
    response_location: "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#15-compliance-and-submission-gates"
    status: drafted

  - requirement_id: DSIP-SUB-ART-VOL7-WEBFORM
    source_anchor: "HR0011SB20254-12 DSIP Vol 7 — Webform"
    requirement_text: >-
      Volume 7 DSIP webform fields complete.
    category: submission_artifact
    response_location: "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#15-compliance-and-submission-gates"
