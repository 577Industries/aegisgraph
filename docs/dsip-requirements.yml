# dsip-requirements.yml
#
# Owned schema: integration stream. Populated content: validator-export stream.
#
# Source: solicitation HR0011SB20254-12 (DSIP Direct-to-Phase-II proposal
# preparation instructions), as referenced in the master proposal §1, §15,
# and §17 [1][2]. The actual solicitation PDF is not redistributed here;
# we reference it indirectly through the master proposal and the FAQ doc.
#
# Each entry captures:
#
#   - requirement_id:    stable internal identifier; format ^DSIP-[A-Z0-9-]+$
#                        e.g. DSIP-PAGE-LIMIT-TECH, DSIP-EVAL-CRIT-3
#   - source_anchor:     section reference inside HR0011SB20254-12 (or the
#                        proposal section that interprets it)
#   - requirement_text:  verbatim quote from the solicitation (kept <500
#                        chars; longer requirements summarized with the
#                        full text linked via source_anchor)
#   - category:          enum:
#                          page_limit | format_requirement | evaluation_criterion
#                        | deliverable | ksa_crosswalk | submission_artifact
#   - response_location: optional string, doc-relative path inside
#                        03_PROPOSAL where this requirement is addressed
#   - status:            enum: open | drafted | satisfied
#                          open      - not yet checked against the proposal
#                          drafted   - response_location is set but not final
#                          satisfied - response is final and reviewed
#
# Cross-references:
#
#   - Proposal claims that satisfy a requirement set
#     `dsip_requirement: <requirement_id>` in proposal-claims-index.yml.
#     The traceability matrix joins the two and reports unmatched
#     requirements (claim_without_evidence) and unmatched claims
#     (evidence_without_claim).

requirements:
  # ----- Page limits (master proposal §16) -----
  - requirement_id: DSIP-PAGE-LIMIT-WP
    source_anchor: "HR0011SB20254-12 Volume 2 — Technical Volume / White Paper"
    requirement_text: >-
      White paper must not exceed 20 pages.
    category: page_limit
    response_location: "03_PROPOSAL/active-package/01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md"
    status: drafted

  - requirement_id: DSIP-PAGE-LIMIT-SLIDES
    source_anchor: "HR0011SB20254-12 Volume 2 — Technical Volume / Slides"
    requirement_text: >-
      Technical volume slide deck must not exceed 15 slides.
    category: page_limit
    response_location: "03_PROPOSAL/active-package/01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md"
    status: drafted

  - requirement_id: DSIP-PAGE-LIMIT-TECH
    source_anchor: "HR0011SB20254-12 Volume 2 — Technical Volume"
    requirement_text: >-
      Full technical volume (incl. work plan, references, figures) must not exceed
      35 pages.
    category: page_limit
    response_location: "03_PROPOSAL/active-package/01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md"
    status: drafted

  # ----- Format requirements -----
  - requirement_id: DSIP-FORMAT-FONT-SIZE
    source_anchor: "HR0011SB20254-12 General Submission Instructions"
    requirement_text: >-
      Body text must be ≥11 pt; figure/table caption text ≥10 pt.
    category: format_requirement
    response_location: null
    status: open

  - requirement_id: DSIP-FORMAT-MARGINS
    source_anchor: "HR0011SB20254-12 General Submission Instructions"
    requirement_text: >-
      All four margins must be ≥1 inch.
    category: format_requirement
    response_location: null
    status: open

  # ----- Evaluation criteria (HR0011SB20254-12 §V) -----
  - requirement_id: DSIP-EVAL-CRIT-NOVELTY
    source_anchor: "HR0011SB20254-12 Section V — Evaluation Criteria"
    requirement_text: >-
      Soundness, technical merit, and innovation of the proposed approach. The
      proposer must distinguish novelty from composition of existing tools.
    category: evaluation_criterion
    response_location: "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#4.4-what-is-novel-about-aegisgraph"
    status: drafted

  - requirement_id: DSIP-EVAL-CRIT-FEASIBILITY
    source_anchor: "HR0011SB20254-12 Section V — Evaluation Criteria"
    requirement_text: >-
      Phase I-equivalent feasibility documentation: completed feasibility study or
      basic prototype system, properties desirable for DoD and civilian use,
      comparisons with alternative methodologies, technical reports, and prototype
      designs/models.
    category: evaluation_criterion
    response_location: "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#4-phase-i-equivalent-feasibility-and-prior-work"
    status: drafted

  - requirement_id: DSIP-EVAL-CRIT-COMMERCIAL
    source_anchor: "HR0011SB20254-12 Section V — Evaluation Criteria"
    requirement_text: >-
      Commercialization plan including market thesis, target buyers, packaging and
      pricing, paid pilot design, and Phase III funding pathway.
    category: evaluation_criterion
    response_location: "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#12-commercialization-and-transition"
    status: drafted

  - requirement_id: DSIP-EVAL-CRIT-REPRO
    source_anchor: "HR0011SB20254-12 Section V — Evaluation Criteria"
    requirement_text: >-
      Reproducibility of evidence: each real-target graph path must be reproducible
      from target repository, pinned commit, evidence refs, source/file anchors,
      baseline-tool status, score vector, validation task, and limitation note.
    category: evaluation_criterion
    response_location: "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#10.3-reproducibility"
    status: drafted

  - requirement_id: DSIP-EVAL-CRIT-SAFETY
    source_anchor: "HR0011SB20254-12 Section V — Evaluation Criteria"
    requirement_text: >-
      Safety scan must show no private paths, credentials, target-source
      redistribution markers, unauthorized target traces, or unsupported static
      security-finding language across the public package and exports.
    category: evaluation_criterion
    response_location: "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#10.2-safety-scan"
    status: drafted

  # ----- Deliverables (Phase II base + option) -----
  - requirement_id: DSIP-DELIVERABLE-KICKOFF
    source_anchor: "HR0011SB20254-12 Section IV — Phase II Deliverables"
    requirement_text: >-
      Month 1 kickoff briefing with annotated slides; updated technical approach,
      risks/mitigations, schedule, dependencies, and metrics.
    category: deliverable
    response_location: "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#9.2-months-1-4"
    status: drafted

  - requirement_id: DSIP-DELIVERABLE-Q1
    source_anchor: "HR0011SB20254-12 Section IV — Phase II Deliverables"
    requirement_text: >-
