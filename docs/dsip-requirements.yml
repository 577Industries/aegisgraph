    category: deliverable
    response_location: "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#9.3-months-5-7"
    status: drafted

  - requirement_id: DSIP-DELIVERABLE-Q3
    source_anchor: "HR0011SB20254-12 Section IV — Phase II Deliverables"
    requirement_text: >-
      Month 10 quarterly technical progress report; reviewer workbench prototype;
      exportable top-five validator packet.
    category: deliverable
    response_location: "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#9.4-months-8-10"
    status: drafted

  - requirement_id: DSIP-DELIVERABLE-FINAL
    source_anchor: "HR0011SB20254-12 Section IV — Phase II Deliverables"
    requirement_text: >-
      Month 14 final demonstration: architecture, documented APIs, user manual,
      system design, commercialization plan, and final technical briefing.
    category: deliverable
    response_location: "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#9.5-months-11-14"
    status: drafted

  - requirement_id: DSIP-DELIVERABLE-OPTION-M19
    source_anchor: "HR0011SB20254-12 Section IV — Phase II Option Period"
    requirement_text: >-
      Month 19 productization gap report.
    category: deliverable
    response_location: "01_master_proposal/AegisGraph_ASEMA_DP2_Master_Proposal_v0.3.md#9.6-months-15-24-option"
