# KSA crosswalk: Knowledge / Skills / Abilities lifted from
# HR0011SB20254-12 Section II.A.2 (DARPA proposer eligibility for ASEMA).
# Each KSA row maps to the master-proposal section that evidences team
# depth in the area.
ksa_crosswalk:
  computer_science:
    description: >-
      Computer Science depth: programming-language semantics, type systems, parser
      and compiler implementation, static and dynamic program analysis, schema
      design, graph algorithms, hash chains, and reproducible-build engineering.
    proposal_section: "13.1 Key Personnel"
    representative_artifacts:
      - aegisgraph/safety.py
      - aegisgraph/schema.py
      - aegisgraph/hashchain.py
      - schema/evidence.schema.json
      - schema/fact-vector.schema.json
  vulnerability_research:
    description: >-
      Vulnerability research: pre-disclosure simulation discipline, CVE corpus
      handling, ASAN-bounded reproduction, harness construction with safety
      boundaries (no exploitation, no production targeting), parser-disagreement
      methodology, claim-state lifecycle preventing overclaim.
    proposal_section: "4.4 What is novel about AegisGraph"
    representative_artifacts:
      - reprochain/evidence/build_manifest.json
      - polydiff/regression/report.json
      - aegisgraph/safety.py
      - validator/sanitize_check.py
  software_engineering:
    description: >-
      Software engineering: deterministic builds, REQUIRED_TOOLS pin tables,
      strict-mode CI fail-closed gates, additive-only schema evolution, schema
      validation in CI, integration test coverage of governance-critical
      contracts.
    proposal_section: "13.3 Execution Discipline"
    representative_artifacts:
      - Makefile
      - aegisgraph/tooling.py
      - devcontainer/
      - tests/test_validation_e2e.py
      - tests/test_export_private_complete.py

# Deliverables list (machine-readable contract; mirrors the
# DSIP-DELIVERABLE-* requirements above with explicit timing/contents).
deliverables:
