# AegisGraph InvariantCheck INV-09 (M7-GT-v3 production)
#
# Statement: Android WebView instances shall not call
# addJavascriptInterface() on user-controlled content without setting
# setAllowFileAccess(false), setAllowContentAccess(false), and a
# same-origin guard on the bound object.
#
# Rationale: addJavascriptInterface bridges the JS execution context
# into the host app, exposing reflectively-callable Java methods. When
# the WebView loads attacker-influenced HTML (link preview, federated
# room content, oEmbed) without origin restrictions, the bridge becomes
# a remote-code-execution surface.
#
# See aegisgraph/invariants/manifest.json :: INV-09 for the canonical
# statement, rationale, MASTG-PLATFORM-7 / SSDF PW.5.1 mappings, and
# the demo-vulnerable-app ground-truth expectation (2 violations).
#
# Pattern strategy:
#   Find: a method that calls $W.addJavascriptInterface(...)
#   Inside the same method, NOT also calling:
#     * $X.setAllowFileAccess(false)   (file-URL barrier)
#     * $Y.setAllowContentAccess(false) (content-URL barrier)
#     * any of {isSameOrigin, checkOrigin, verifyOriginAllowlist,
#       isAllowedOrigin} as a method call
#   Then the bridge is unhardened — emit a finding.

rules:
  - id: aegisgraph.inv-09-webview-jsinterface-addjavascript
    languages:
      - java
    severity: ERROR
    message: |
      INV-09: WebView.addJavascriptInterface() is called without the
      required hardening sequence — setAllowFileAccess(false),
      setAllowContentAccess(false), and a same-origin guard on the bound
      object. When the WebView loads attacker-influenced HTML, the
      JS-to-Java bridge becomes a remote-code-execution surface.
    metadata:
      category: security
      invariant_id: INV-09
      cwe: CWE-749
      mastg: MSTG-PLATFORM-7
      ssdf: PW.5.1
      aegisgraph_path_class:
        - link_preview
        - native_boundary
      references:
        - https://developer.android.com/reference/android/webkit/WebView#addJavascriptInterface(java.lang.Object,%20java.lang.String)
        - https://owasp.org/www-project-mobile-app-security/MASTG/0x05h-Testing-Platform-Interaction
    patterns:
      # The enclosing method calls addJavascriptInterface.
      - pattern: |
          $RET $METHOD(...) {
            ...
            $W.addJavascriptInterface($OBJ, $NAME);
            ...
          }
      # Barrier 1: same method must NOT also call setAllowFileAccess(false).
      - pattern-not: |
          $RET $METHOD(...) {
            ...
            $X.setAllowFileAccess(false);
            ...
          }
      # Barrier 2: same method must NOT also call setAllowContentAccess(false).
      - pattern-not: |
          $RET $METHOD(...) {
            ...
            $Y.setAllowContentAccess(false);
            ...
          }
      # Barrier 3: same method must NOT contain a same-origin guard.
      - pattern-not-regex: |
          (?:isSameOrigin|checkOrigin|verifyOriginAllowlist|isAllowedOrigin)
